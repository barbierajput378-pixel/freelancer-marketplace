<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Freelancer Marketplace — DB Management System</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171d2b;
    --border: #2a3245;
    --accent: #5b8def;
    --text: #e8ecf4;
    --muted: #94a1b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }

  nav {
    display: flex;
    gap: 4px;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  nav button {
    background: none;
    border: none;
    color: var(--muted);
    padding: 12px 16px;
    cursor: pointer;
    font-size: 0.9rem;
    border-bottom: 2px solid transparent;
  }
  nav button.active {
    color: var(--text);
    border-bottom: 2px solid var(--accent);
  }

  main { padding: 24px 28px; max-width: 1100px; margin: 0 auto; }
  .tab { display: none; }
  .tab.active { display: block; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 1rem; color: var(--accent); }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .form-grid label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .form-grid input,
  .form-grid select {
    width: 100%;
    padding: 8px;
    background: #10151f;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
  }
  .form-grid select { cursor: pointer; }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  button.action {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  button.action.secondary { background: #2a3245; }
  button.action.danger { background: #d9534f; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  tr:hover { background: #1c2434; cursor: pointer; }

  pre#dashboardOutput {
    background: #10151f;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    max-height: 400px;
    overflow: auto;
    font-size: 0.8rem;
  }
  .status { font-size: 0.8rem; color: var(--muted); margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>

<header>
  <h1>Freelancer Marketplace — Database Management System</h1>
  <p>Assignment 9 · GUI-based 3-tier Database Application (Browser → API → MySQL)</p>
</header>

<nav id="tabNav"></nav>

<main id="tabContent"></main>

<script>
const TABLES = {
  Clients: { pk: "client_id", columns: ["client_id", "name", "email", "company_name"] },
  Freelancers: { pk: "freelancer_id", columns: ["freelancer_id", "name", "email", "avg_rating"] },
  Jobs: { pk: "job_id", columns: ["job_id", "client_id", "title", "budget_max", "status"] },
  Offers: { pk: "offer_id", columns: ["offer_id", "job_id", "freelancer_id", "offer_amount", "proposed_duration", "status"] },
  Contracts: { pk: "contract_id", columns: ["contract_id", "job_id", "freelancer_id", "final_amount", "status"] },
};

// Allowed status values per table (first entry is the default shown in the form).
const STATUS_OPTIONS = {
  Jobs: ["Open", "Awarded", "Completed", "Cancelled"],
  Offers: ["Pending", "Selected", "Rejected"],
  Contracts: ["In Progress", "Completed", "Cancelled"],
};
const STATUS_DEFAULT = { Jobs: "Open", Offers: "Pending", Contracts: "In Progress" };

// Foreign-key columns -> the table (and label column) their dropdown is filled from.
const FK = {
  client_id: { table: "Clients", labelCol: "name" },
  job_id: { table: "Jobs", labelCol: "title" },
  freelancer_id: { table: "Freelancers", labelCol: "name" },
};

// Columns allowed to be left blank (everything else is required before sending).
const OPTIONAL = { Freelancers: ["avg_rating"] };

// Latest rows per table, used to fill foreign-key dropdowns and compute next ids.
const cache = {};

const nav = document.getElementById("tabNav");
const content = document.getElementById("tabContent");

// Decides how a given column is rendered in the entry form.
function fieldType(name, col) {
  if (col === TABLES[name].pk) return "pk";
  if (col === "status" && STATUS_OPTIONS[name]) return "status";
  if (FK[col]) return "fk";
  return "text";
}

function buildNav() {
  Object.keys(TABLES).forEach((name, i) => {
    const btn = document.createElement("button");
    btn.textContent = name;
    btn.dataset.tab = name;
    if (i === 0) btn.classList.add("active");
    btn.onclick = () => switchTab(name);
    nav.appendChild(btn);
  });
  const dashBtn = document.createElement("button");
  dashBtn.textContent = "Dashboard";
  dashBtn.dataset.tab = "Dashboard";
  dashBtn.onclick = () => switchTab("Dashboard");
  nav.appendChild(dashBtn);
}

function switchTab(name) {
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.id === "tab-" + name));
}

function buildField(name, col) {
  const id = `${name}-${col}`;
  const type = fieldType(name, col);
  let control;
  if (type === "status") {
    const opts = STATUS_OPTIONS[name]
      .map(s => `<option value="${s}">${s}</option>`).join("");
    control = `<select id="${id}">${opts}</select>`;
  } else if (type === "fk") {
    // Options are filled from the database once the source table is loaded.
    control = `<select id="${id}"><option value="">Loading…</option></select>`;
  } else {
    control = `<input type="text" id="${id}" />`;
  }
  return `<div><label>${col}</label>${control}</div>`;
}

// Extra workflow buttons for specific tables.
function extraButtons(name) {
  if (name === "Offers") {
    return `<button class="action" onclick="awardOffer()">Award this offer</button>`;
  }
  if (name === "Contracts") {
    return `<button class="action" onclick="setContractStatus('Completed')">Mark Completed</button>
            <button class="action danger" onclick="setContractStatus('Cancelled')">Cancel</button>`;
  }
  return "";
}

function buildTableTab(name, def) {
  const tab = document.createElement("div");
  tab.className = "tab";
  tab.id = "tab-" + name;

  const formFields = def.columns.map(col => buildField(name, col)).join("");

  tab.innerHTML = `
    <div class="panel">
      <h2>${name} — Entry Form</h2>
      <div class="form-grid">${formFields}</div>
      <div class="btn-row">
        <button class="action" onclick="addRecord('${name}')">Add</button>
        <button class="action secondary" onclick="updateRecord('${name}')">Update</button>
        <button class="action danger" onclick="deleteRecord('${name}')">Delete</button>
        ${extraButtons(name)}
        <button class="action secondary" onclick="clearForm('${name}')">Clear Form</button>
        <button class="action secondary" onclick="loadRecords('${name}')">Refresh Table</button>
      </div>
      <div class="status" id="${name}-status"></div>
    </div>
    <div class="panel">
      <h2>${name} — Records</h2>
      <table>
        <thead><tr>${def.columns.map(c => `<th>${c}</th>`).join("")}</tr></thead>
        <tbody id="${name}-tbody"></tbody>
      </table>
    </div>
  `;
  content.appendChild(tab);
}

// Fill a foreign-key <select> from the cached rows of its source table.
function fillFkSelect(name, col) {
  const src = FK[col];
  const sel = document.getElementById(`${name}-${col}`);
  if (!sel || !src) return;
  const current = sel.value;
  const rows = cache[src.table] || [];
  const srcPk = TABLES[src.table].pk;
  sel.innerHTML = `<option value="">— select —</option>` +
    rows.map(r => `<option value="${r[srcPk]}">${r[srcPk]} — ${r[src.labelCol] ?? ""}</option>`).join("");
  if (current) sel.value = current;
}

// After a source table changes, refresh every FK dropdown that points at it.
function refreshDependents(sourceTable) {
  Object.keys(TABLES).forEach(t => {
    TABLES[t].columns.forEach(col => {
      if (FK[col] && FK[col].table === sourceTable && col !== TABLES[t].pk) {
        fillFkSelect(t, col);
      }
    });
  });
}

// Pre-fill the primary-key box with the next free id (MAX + 1).
function prefillNextId(name) {
  const pk = TABLES[name].pk;
  const rows = cache[name] || [];
  const maxId = rows.reduce((m, r) => Math.max(m, Number(r[pk]) || 0), 0);
  const el = document.getElementById(`${name}-${pk}`);
  if (el) el.value = maxId + 1;
}

function buildDashboardTab() {
  const tab = document.createElement("div");
  tab.className = "tab";
  tab.id = "tab-Dashboard";
  tab.innerHTML = `
    <div class="panel">
      <h2>Quick Reports</h2>
      <div class="btn-row">
        <button class="action secondary" onclick="runReport('open-high-budget')">Open Jobs (budget ≥ 70,000)</button>
        <button class="action secondary" onclick="runReport('active-freelancers')">Freelancers with ≥1 Offer</button>
        <button class="action secondary" onclick="runReport('completed-summary')">Completed Contracts Summary</button>
      </div>
      <pre id="dashboardOutput">Click a report button above.</pre>
    </div>
  `;
  content.appendChild(tab);
}

async function runReport(type) {
  const out = document.getElementById("dashboardOutput");
  out.textContent = "Loading...";
  try {
    const res = await fetch(`/api/reports?type=${type}`);
    const data = await res.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    out.textContent = "Error: " + e.message;
  }
}

function clearForm(name) {
  TABLES[name].columns.forEach(col => {
    const el = document.getElementById(`${name}-${col}`);
    if (fieldType(name, col) === "status") {
      el.value = STATUS_DEFAULT[name];
    } else {
      el.value = "";
    }
  });
  prefillNextId(name);
}

function setStatus(name, msg, isError = false) {
  const el = document.getElementById(`${name}-status`);
  el.textContent = msg;
  el.style.color = isError ? "#d9534f" : "#94a1b8";
}

function getFormValues(name) {
  const obj = {};
  TABLES[name].columns.forEach(c => {
    const v = document.getElementById(`${name}-${c}`).value.trim();
    obj[c] = v === "" ? null : v;  // blanks become NULL, not empty strings
  });
  return obj;
}

// Block submission when a required field is blank; returns true if OK to send.
function validateRequired(name) {
  const optional = OPTIONAL[name] || [];
  for (const col of TABLES[name].columns) {
    if (optional.includes(col)) continue;
    const el = document.getElementById(`${name}-${col}`);
    if (!el.value.trim()) {
      setStatus(name, `"${col}" is required — please fill it in.`, true);
      el.focus();
      return false;
    }
  }
  return true;
}

async function loadRecords(name) {
  const tbody = document.getElementById(`${name}-tbody`);
  tbody.innerHTML = `<tr><td colspan="${TABLES[name].columns.length}">Loading...</td></tr>`;
  try {
    const res = await fetch(`/api/${name.toLowerCase()}`);
    const rows = await res.json();
    cache[name] = rows;
    tbody.innerHTML = "";
    rows.forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = TABLES[name].columns.map(c => `<td>${row[c] ?? ""}</td>`).join("");
      tr.onclick = () => {
        TABLES[name].columns.forEach(c => {
          document.getElementById(`${name}-${c}`).value = row[c] == null ? "" : String(row[c]);
        });
      };
      tbody.appendChild(tr);
    });
    // Keep dependent foreign-key dropdowns in sync with the fresh data.
    refreshDependents(name);
    setStatus(name, `Loaded ${rows.length} record(s).`);
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="${TABLES[name].columns.length}">Error loading records.</td></tr>`;
    setStatus(name, "Error: " + e.message, true);
  }
}

async function addRecord(name) {
  if (!validateRequired(name)) return;
  const body = getFormValues(name);
  try {
    const res = await fetch(`/api/${name.toLowerCase()}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Insert failed");
    setStatus(name, "Record added.");
    await loadRecords(name);
    clearForm(name);
  } catch (e) {
    setStatus(name, "Error: " + e.message, true);
  }
}

async function updateRecord(name) {
  if (!validateRequired(name)) return;
  const body = getFormValues(name);
  const pk = TABLES[name].pk;
  const pkValue = body[pk];
  if (!pkValue) return setStatus(name, `Enter ${pk} to identify the record.`, true);
  try {
    const res = await fetch(`/api/${name.toLowerCase()}?pk=${pkValue}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Update failed");
    setStatus(name, `Updated (${data.affectedRows} row).`);
    loadRecords(name);
  } catch (e) {
    setStatus(name, "Error: " + e.message, true);
  }
}

async function deleteRecord(name) {
  const pk = TABLES[name].pk;
  const pkValue = document.getElementById(`${name}-${pk}`).value.trim();
  if (!pkValue) return setStatus(name, `Enter ${pk} to identify the record.`, true);
  if (!confirm(`Delete ${name} record where ${pk} = ${pkValue}?`)) return;
  try {
    const res = await fetch(`/api/${name.toLowerCase()}?pk=${pkValue}`, { method: "DELETE" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Delete failed");
    setStatus(name, `Deleted (${data.affectedRows} row).`);
    clearForm(name);
    loadRecords(name);
  } catch (e) {
    setStatus(name, "Error: " + e.message, true);
  }
}

// ---- workflow actions ----

// Offers tab: run AwardOffer for the offer currently in the form.
async function awardOffer() {
  const offerId = document.getElementById("Offers-offer_id").value.trim();
  if (!offerId) {
    return setStatus("Offers", "Click an offer row first, then Award this offer.", true);
  }
  try {
    const res = await fetch(`/api/award?offer_id=${encodeURIComponent(offerId)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Award failed");
    setStatus("Offers", data.message || "Offer awarded.");
    // The workflow touches offers, jobs and contracts — refresh all three.
    await loadRecords("Offers");
    await loadRecords("Jobs");
    await loadRecords("Contracts");
  } catch (e) {
    setStatus("Offers", "Error: " + e.message, true);
  }
}

// Contracts tab: mark the selected contract Completed or Cancelled.
async function setContractStatus(newStatus) {
  const name = "Contracts";
  const pk = TABLES[name].pk;
  const pkValue = document.getElementById(`${name}-${pk}`).value.trim();
  if (!pkValue) {
    return setStatus(name, "Click a contract row first, then use these buttons.", true);
  }
  const body = getFormValues(name);
  body.status = newStatus;
  try {
    const res = await fetch(`/api/contracts?pk=${encodeURIComponent(pkValue)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Update failed");
    setStatus(name, `Contract ${pkValue} marked ${newStatus}.`);
    await loadRecords("Contracts");
    await loadRecords("Jobs");
  } catch (e) {
    setStatus(name, "Error: " + e.message, true);
  }
}

// ---- init ----
buildNav();
Object.entries(TABLES).forEach(([name, def]) => buildTableTab(name, def));
buildDashboardTab();
document.querySelector(".tab").classList.add("active");

(async function init() {
  // Load the source tables first so the foreign-key dropdowns can be filled.
  for (const name of Object.keys(TABLES)) {
    await loadRecords(name);
  }
  // Set status defaults and the next-id prefill on every entry form.
  Object.keys(TABLES).forEach(name => clearForm(name));
})();
</script>
</body>
</html>
